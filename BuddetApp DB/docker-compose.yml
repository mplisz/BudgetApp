# ============================================================
# File: docker-compose.yml
# Azure Cosmos DB Emulator (Linux) configuration
# ============================================================

version: '3.8'

services:
  local-cosmos-db:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: local-cosmos-db
    hostname: localhost
    tty: true
    ports:
      - "8081:8081"
      - "10250-10255:10250-10255"
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=10
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_EXPLORER=true
      - AZURE_COSMOS_EMULATOR_IP_ADDRESS_OVERRIDE=127.0.0.1
      - AZURE_COSMOS_EMULATOR_MASTER_KEY=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      - AZURE_COSMOS_EMULATOR_RECREATE_DATA_ON_STARTUP=false
      - AZURE_COSMOS_EMULATOR_DATA_DIRECTORY=/var/lib/cosmosdb
    volumes:
      # FIX 1: Musi być myślnik przed nazwą wolumenu (to jest lista montowań)
      - DataBaseCosmos:/var/lib/cosmosdb
    restart: always
    deploy:
      resources:
        limits:
          memory: 3G

# FIX 2: Tutaj definiujemy wolumen jako mapowanie (słownik)
volumes:
  DataBaseCosmos:
    # Zostawiamy puste, żeby Docker sam zarządzał folderem